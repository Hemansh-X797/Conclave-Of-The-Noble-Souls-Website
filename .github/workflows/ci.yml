name: CI - Build and Test

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]  # Use Node 18.x as per package.json engines

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (Linting)
        run: npm run lint  # ESLint for JS/TS files

      - name: Run Stylelint (CSS/SCSS Linting)
        run: npm run stylelint  # Stylelint for CSS/SCSS files

      - name: Run Prettier (Formatting Check)
        run: npm run check-format  # Check formatting without fixing

      - name: Run Tests (Vitest and Jest)
        run: |
          npm run test  # Run vitest for unit tests
          npm run test:ui  # Run Playwright UI tests if you have them
          npm run test:coverage  # Optional: if you want test coverage reports

      - name: Check Vulnerabilities (npm audit)
        run: npm audit --audit-level=moderate  # Ensures no major vulnerabilities
